name: Validate repository

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML validation dependency
        run: python3 -m pip install -r scripts/requirements-validation.txt
      - name: Test YAML regression guards
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate version and stable rules
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/validate_repository.py --base-ref "$BASE_REF"
      - name: Check diff whitespace
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_REF"...HEAD
