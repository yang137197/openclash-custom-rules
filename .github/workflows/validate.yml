name: Validate repository

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML validation dependency
        run: python3 -m pip install -r scripts/requirements-validation.txt
      - name: Regenerate rolling Manual-Direct payload from source
        run: python3 scripts/sync_manual_direct.py --write
      - name: Test YAML regression guards
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate version and stable rules
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/validate_repository.py --base-ref "$BASE_REF"
      - name: Fetch pinned native validation tools
        run: python3 scripts/fetch_dual_validation_tools.py "$RUNNER_TEMP/dual-jp-tools"
      - name: Test official OpenClash merge and native candidate behavior
        run: |
          ruby -ryaml -e 'puts RUBY_VERSION'
          python3 scripts/verify_dual_subscription_native.py --core "$RUNNER_TEMP/dual-jp-tools/mihomo" --ruby ruby --official-yaml "$RUNNER_TEMP/dual-jp-tools/YAML.rb" --report "$RUNNER_TEMP/dual-jp-native-report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: dual-jp-native-validation
          path: ${{ runner.temp }}/dual-jp-native-report.json
      - name: Check diff whitespace
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --check "$BASE_REF"...HEAD
          git diff --check
