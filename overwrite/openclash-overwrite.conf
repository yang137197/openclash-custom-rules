# OpenClash 通用覆写：大陆直连 + 手工直连 + 其余美国手选
#
# 设计目标：
# 1. 中国大陆域名/IP默认直连。
# 2. rules/manual-direct.yaml 用于人工追加必须直连的域名。
# 3. 其余所有流量统一进入“美国”策略组。
# 4. “美国”为 select 手动选择组，仅展示订阅中的美国节点。
# 5. 非美国节点仍保留在订阅底层，但不进入任何策略组，也不会被规则使用。
# 6. 不按设备/IP/人员拆分规则，因此可供多人、多设备直接复用。
# 7. 不整体覆盖 rule-providers，避免删除 OpenClash 自动生成的 oc-cn-domain 等内部 provider。
# 8. 保留 Fake-IP，同时对局域网和自建回流域名返回真实 IP，降低 NAT 回流/内网访问异常概率。
#
# 适用：OpenClash Meta/Mihomo。
# 维护说明见仓库 README.md。

[General]
CORE_TYPE = Meta
PROXY_MODE = rule
RESTART = true
ENABLE_REDIRECT_DNS = 1
ENABLE_CUSTOM_DNS = 1
APPEND_DEFAULT_DNS = 0
APPEND_WAN_DNS = 0
ENABLE_RESPECT_RULES = 1
ROUTER_SELF_PROXY = 1
IPV6_DNS = 0
ENABLE_UDP_PROXY = 1
DISABLE_UDP_QUIC = 1
ENABLE_META_SNIFFER = 1
ENABLE_META_SNIFFER_PURE_IP = 1

[YAML]

# 保存手工选择的策略组节点与 Fake-IP 状态，重启后尽量保持原选择。
profile:
  store-selected: true
  store-fake-ip: true

# DNS 分流原则：
# - 中国大陆/私有域名：国内 DNS。
# - 其他域名：国外 DNS，并通过“美国”策略组建立连接。
# - respect-rules=true：DNS 上游自身连接也遵循分流规则。
dns:
  enable: true
  ipv6: false
  respect-rules: true
  prefer-h3: false

  # DoH 域名解析前必须可用的基础 DNS，仅填写纯 IP DNS。
  default-nameserver:
    - 223.5.5.5
    - 1.12.12.12

  # 解析代理节点服务器域名，使用国内可直连 DNS，避免形成代理递归依赖。
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query

  # 默认用于非大陆域名；“#美国”要求 DNS 连接通过美国策略组。
  nameserver:
    - 'https://1.1.1.1/dns-query#美国'
    - 'https://8.8.8.8/dns-query#美国'

  # 明确直连流量的 DNS。
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  direct-nameserver-follow-policy: true

  # 中国大陆域名和局域网/私有域名优先使用国内 DNS。
  nameserver-policy:
    'geosite:cn,private':
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query

  # Fake-IP 排除项：这些域名返回真实 IP。
  # 用于局域网、本地域名以及需要 NAT 回流/内网解析的自建域名。
  # “+”表示追加，不清空 OpenClash 已有 fake-ip-filter；尤其不要删除 OpenClash 自动加入的 rule-set:oc-cn-domain。
  fake-ip-filter+:
    - '+.lan'
    - '+.local'
    - '+.home.arpa'
    - 'localhost'

    # 当前环境的自建服务域名：需要解析真实地址，避免 Fake-IP 干扰内网回流。
    # 如以后新增同类域名，按相同格式逐行添加。
    - 'pve.yangnas.cn'
    - 'auth.yangnas.cn'
    - 'nexus.yangnas.cn'

# ============================================================
# 海外策略组
# ============================================================
# select = 手动选择节点，不自动切换出口。
# include-all = 从订阅中的全部节点筛选。
# filter = 仅把名称符合美国特征的节点放入本组。
# 非美国节点依然存在于订阅底层，但不会显示在本策略组，也没有任何规则会调用它们。
#
# 若机场的美国节点命名不符合下面表达式，只修改 filter，不要增加其他国家策略组。
proxy-groups!:
  - name: 美国
    type: select
    include-all: true
    filter: '(?i)(🇺🇸|美国|美國|United[ _-]?States|USA|America|Los[ _-]?Angeles|San[ _-]?Jose|Seattle|New[ _-]?York|Chicago|Dallas|(?:^|[ _-])US(?:$|[ _-]|[0-9]))'

# ============================================================
# 手工直连规则提供者
# ============================================================
# 这里只“增加” Manual-Direct，不覆盖 OpenClash 自己生成的 rule-providers。
# OpenClash 可能动态生成 oc-cn-domain 等内部规则集，必须保留。
rule-providers:
  Manual-Direct:
    type: http
    behavior: classical
    format: yaml
    # 规则文件本身托管在 GitHub。下载规则不需要经过美国代理，避免美国节点不可用时无法获取直连规则。
    proxy: DIRECT
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/manual-direct.yaml
    path: ./rule_provider/manual-direct.yaml
    interval: 300

# ============================================================
# 主分流规则：严格按从上到下顺序匹配，第一条命中即停止。
# ============================================================
# 1. private 域名/私有 IP：局域网、本机、内网资源优先直连，避免回流到代理。
# 2. Manual-Direct：人工维护的额外直连域名。
# 3. geosite:cn：中国大陆域名直连。
# 4. GEOIP,CN：纯 IP 或域名规则未命中但目标 IP 属于中国大陆时直连。
# 5. MATCH,美国：以上均未命中时，全部交给手工选择的美国节点。
rules!:
  # 局域网 / 私有网络
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - IP-CIDR6,ff00::/8,DIRECT,no-resolve

  # 人工指定必须直连的域名，内容维护在 rules/manual-direct.yaml。
  - RULE-SET,Manual-Direct,DIRECT

  # 中国大陆域名 / IP
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve

  # 最终兜底：所有其他流量统一走美国。
  - MATCH,美国
