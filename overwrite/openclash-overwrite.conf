# OpenClash 远程覆写：地区节点组 + 设备来源分流 + 手工域名规则
# 适用于 OpenClash v0.47.081+ / Mihomo v1.19.28+。
# 前置插入本仓库规则，第三方订阅仅保留节点、原策略组和最终兜底规则。

[General]
CORE_TYPE = Meta
PROXY_MODE = rule

# 远程模块定时更新成功后自动重启；手动刷新模块后仍以 OpenClash 界面的“应用/重启”为准。
RESTART = true

# 劫持局域网 DNS 并使用下方明确配置的分流 DoH；禁止追加 WAN/运营商 DNS。
ENABLE_REDIRECT_DNS = 1
ENABLE_CUSTOM_DNS = 1
APPEND_DEFAULT_DNS = 0
APPEND_WAN_DNS = 0
ENABLE_RESPECT_RULES = 1
ROUTER_SELF_PROXY = 1

# 设备策略按 IPv4 来源地址匹配：DNS 不返回 AAAA，避免同一设备改走 IPv6 后绕过策略。
# 不再用 IP-CIDR6,::/0,REJECT 硬拒绝全部公网 IPv6，避免应用直接判定无网络。
IPV6_DNS = 0

# 开启 UDP 代理，但拒绝 UDP/443 QUIC，使不稳定或不支持 UDP 的节点回落到 TCP/HTTPS。
ENABLE_UDP_PROXY = 1
DISABLE_UDP_QUIC = 1

# 从 TLS/QUIC 纯 IP 连接恢复域名，避免 TikTok CDN 因没有域名而误命中国直连规则。
ENABLE_META_SNIFFER = 1
ENABLE_META_SNIFFER_PURE_IP = 1

[YAML]

profile:
  store-selected: true
  store-fake-ip: true

# 局域网发现名称返回真实地址，避免 Fake-IP 干扰手机连接等本地通信。
dns:
  enable: true
  ipv6: false
  respect-rules: true
  prefer-h3: false
  default-nameserver:
    - 223.5.5.5
    - 1.12.12.12
  # 节点域名由国内 DoH 直连解析，避免解析节点自身时形成循环依赖。
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  # 非中国域名默认通过“DNS-海外”组查询，不交给 WAN/运营商 DNS。
  nameserver:
    - 'https://1.1.1.1/dns-query#DNS-海外'
    - 'https://8.8.8.8/dns-query#DNS-海外'
  # 直连域名重新使用国内 DoH 获取适合直连的地址。
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  direct-nameserver-follow-policy: true
  nameserver-policy:
    'geosite:cn,private':
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
    'rule-set:Linyang-TikTok':
      - 'https://1.1.1.1/dns-query#DNS-海外'
      - 'https://8.8.8.8/dns-query#DNS-海外'
    'rule-set:Linyang-Google-Play':
      - 'https://1.1.1.1/dns-query#DNS-海外'
      - 'https://8.8.8.8/dns-query#DNS-海外'
    # Docker Registry/CDN 只使用海外 DoH，避免 DIRECT 解析路径返回异常地址。
    'rule-set:Linyang-Docker':
      - 'https://1.1.1.1/dns-query#DNS-海外'
      - 'https://8.8.8.8/dns-query#DNS-海外'
  fake-ip-filter+:
    - '+.lan'
    - '+.local'
    - '+.home.arpa'
    - 'localhost'

# 每个地区提供一个手选组和一个自动测速组。
# 手选组默认选择自动组，也可在面板里固定某个节点；没有匹配节点时安全拒绝。
proxy-groups+:
  - name: 日本
    type: select
    default-selected: 自动-日本
    proxies:
      - 自动-日本
      - REJECT
    include-all: true
    filter: '(?i)(🇯🇵|日本|东京|東京|大阪|Japan|Tokyo|Osaka|(?:^|[ _-])JP(?:$|[ _-]|[0-9]))'

  - name: 自动-日本
    type: url-test
    include-all: true
    filter: '(?i)(🇯🇵|日本|东京|東京|大阪|Japan|Tokyo|Osaka|(?:^|[ _-])JP(?:$|[ _-]|[0-9]))'
    empty-fallback: REJECT
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 100
    lazy: true

  - name: 美国
    type: select
    default-selected: 自动-美国
    proxies:
      - 自动-美国
      - REJECT
    include-all: true
    filter: '(?i)(🇺🇸|美国|美國|United[ _-]?States|USA|America|Los[ _-]?Angeles|San[ _-]?Jose|Seattle|New[ _-]?York|Chicago|Dallas|(?:^|[ _-])US(?:$|[ _-]|[0-9]))'

  - name: 自动-美国
    type: url-test
    include-all: true
    filter: '(?i)(🇺🇸|美国|美國|United[ _-]?States|USA|America|Los[ _-]?Angeles|San[ _-]?Jose|Seattle|New[ _-]?York|Chicago|Dallas|(?:^|[ _-])US(?:$|[ _-]|[0-9]))'
    empty-fallback: REJECT
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 100
    lazy: true

  - name: 新加坡
    type: select
    default-selected: 自动-新加坡
    proxies:
      - 自动-新加坡
      - REJECT
    include-all: true
    filter: '(?i)(🇸🇬|新加坡|狮城|獅城|Singapore|Singapore[ _-]?City|(?:^|[ _-])SG(?:$|[ _-]|[0-9])|(?:^|[ _-])SIN(?:$|[ _-]|[0-9]))'

  - name: 自动-新加坡
    type: url-test
    include-all: true
    filter: '(?i)(🇸🇬|新加坡|狮城|獅城|Singapore|Singapore[ _-]?City|(?:^|[ _-])SG(?:$|[ _-]|[0-9])|(?:^|[ _-])SIN(?:$|[ _-]|[0-9]))'
    empty-fallback: REJECT
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 100
    lazy: true

  # Docker 专用自动组：只收集日本、美国、新加坡节点，不改变其他业务流量。
  # /v2/ 连通时预期返回 401；把它作为健康状态，避免根路径 404 将可用节点误判失败。
  - name: Docker-自动
    type: url-test
    include-all: true
    filter: '(?i)(🇯🇵|日本|东京|東京|大阪|Japan|Tokyo|Osaka|(?:^|[ _-])JP(?:$|[ _-]|[0-9])|🇺🇸|美国|美國|United[ _-]?States|USA|America|Los[ _-]?Angeles|San[ _-]?Jose|Seattle|New[ _-]?York|Chicago|Dallas|(?:^|[ _-])US(?:$|[ _-]|[0-9])|🇸🇬|新加坡|狮城|獅城|Singapore|Singapore[ _-]?City|(?:^|[ _-])SG(?:$|[ _-]|[0-9])|(?:^|[ _-])SIN(?:$|[ _-]|[0-9]))'
    empty-fallback: REJECT
    url: https://registry-1.docker.io/v2/
    expected-status: 401
    interval: 600
    tolerance: 100
    lazy: true

  # 海外 DoH 的固定出口。它只承载 DNS 查询，不改变设备业务流量的地区组。
  - name: DNS-海外
    type: select
    default-selected: 美国
    proxies:
      - 美国
      - 日本
      - 新加坡

# 默认合并：保留第三方模板原有的 rule-providers。
rule-providers:
  Linyang-Manual-Direct:
    type: http
    behavior: classical
    format: yaml
    proxy: DNS-海外
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/manual-direct.yaml
    path: ./rule_provider/linyang-v2-manual-direct.yaml
    interval: 60

  Linyang-Manual-JP:
    type: http
    behavior: classical
    format: yaml
    proxy: DNS-海外
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/manual-jp.yaml
    path: ./rule_provider/linyang-v2-manual-jp.yaml
    interval: 60

  Linyang-Manual-US:
    type: http
    behavior: classical
    format: yaml
    proxy: DNS-海外
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/manual-us.yaml
    path: ./rule_provider/linyang-v2-manual-us.yaml
    interval: 60

  Linyang-Manual-SG:
    type: http
    behavior: classical
    format: yaml
    proxy: DNS-海外
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/manual-sg.yaml
    path: ./rule_provider/linyang-v2-manual-sg.yaml
    interval: 60

  Linyang-Google-Play:
    type: http
    behavior: classical
