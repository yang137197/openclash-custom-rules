# OpenClash 远程覆写：大陆/直连保留，其余统一使用美国
# 适用于 OpenClash v0.47.081+ / Mihomo v1.19.28+。

[General]
CORE_TYPE = Meta
PROXY_MODE = rule
RESTART = true
ENABLE_REDIRECT_DNS = 1
ENABLE_CUSTOM_DNS = 1
APPEND_DEFAULT_DNS = 0
APPEND_WAN_DNS = 0
ENABLE_RESPECT_RULES = 1
ROUTER_SELF_PROXY = 1
IPV6_DNS = 0
ENABLE_UDP_PROXY = 1
DISABLE_UDP_QUIC = 1
ENABLE_META_SNIFFER = 1
ENABLE_META_SNIFFER_PURE_IP = 1

[YAML]

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  respect-rules: true
  prefer-h3: false
  default-nameserver:
    - 223.5.5.5
    - 1.12.12.12
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  nameserver:
    - 'https://1.1.1.1/dns-query#美国'
    - 'https://8.8.8.8/dns-query#美国'
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  direct-nameserver-follow-policy: true
  nameserver-policy:
    'geosite:cn,private':
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
  fake-ip-filter+:
    - '+.lan'
    - '+.local'
    - '+.home.arpa'
    - 'localhost'

# 仅保留一个海外策略组：从订阅中自动测速并选择美国节点。
# 使用 ! 强制替换订阅自带的策略组，避免 AI、日本、GLOBAL 等旧组继续显示。
proxy-groups!:
  - name: 美国
    type: url-test
    include-all: true
    filter: '(?i)(🇺🇸|美国|美國|United[ _-]?States|USA|America|Los[ _-]?Angeles|San[ _-]?Jose|Seattle|New[ _-]?York|Chicago|Dallas|(?:^|[ _-])US(?:$|[ _-]|[0-9]))'
    empty-fallback: REJECT
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 100
    lazy: true

rule-providers:
  Linyang-Manual-Direct:
    type: http
    behavior: classical
    format: yaml
    proxy: 美国
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/manual-direct.yaml
    path: ./rule_provider/linyang-v3-manual-direct.yaml
    interval: 60

# 规则按优先级：局域网直连、手工直连、中国大陆直连，其余统一美国。
# 使用 ! 移除订阅内原有规则，避免其继续引用已删除的策略组。
rules!:
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - IP-CIDR6,ff00::/8,DIRECT,no-resolve
  - RULE-SET,Linyang-Manual-Direct,DIRECT
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,美国
