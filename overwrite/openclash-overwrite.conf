# OpenClash 远程覆写：AI 日本分流 + 俄罗斯电商分流
# 适用于 OpenClash v0.47.081+ / Mihomo。
# 仅追加策略组、规则提供者和规则，不替换第三方订阅模板的原配置。

[YAML]

profile:
  store-selected: true
  store-fake-ip: true

# 追加两个独立策略组，保留第三方模板原有的 proxy-groups。
proxy-groups+:
  - name: AI-日本
    type: url-test
    include-all: true
    filter: '(?i)(🇯🇵|日本|东京|東京|大阪|Japan|Tokyo|Osaka|(?:^|[ _-])JP(?:$|[ _-]|[0-9]))'
    exclude-filter: '(?i)(剩余|流量|套餐|到期|官网|订阅|重置|Traffic|Expire|群组|以下)'
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 100
    lazy: true

  # 当前订阅没有俄罗斯节点时保留 DIRECT，避免空策略组导致配置失败。
  # 后续加入俄罗斯节点后，会按名称自动收集并可在面板中手动选择。
  - name: 俄罗斯电商
    type: select
    proxies:
      - DIRECT
    include-all: true
    filter: '(?i)(🇷🇺|俄罗斯|俄羅斯|俄国|俄國|Russia|Moscow|Saint[ _-]?Petersburg|莫斯科|圣彼得堡|聖彼得堡|(?:^|[ _-])RU(?:$|[ _-]|[0-9]))'
    exclude-filter: '(?i)(剩余|流量|套餐|到期|官网|订阅|重置|Traffic|Expire|群组|以下)'

# 默认合并：保留第三方模板原有的 rule-providers。
rule-providers:
  Linyang-AI:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/ai.yaml
    path: ./rule_provider/linyang-ai.yaml
    interval: 86400

  Linyang-Russia-Commerce:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/ru-commerce.yaml
    path: ./rule_provider/linyang-ru-commerce.yaml
    interval: 86400

# 前置插入：保证在第三方模板的 CN/MATCH 等规则之前优先命中。
+rules:
  - RULE-SET,Linyang-Russia-Commerce,俄罗斯电商
  - RULE-SET,Linyang-AI,AI-日本
