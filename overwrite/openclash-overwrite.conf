# OpenClash 通用覆写：大陆直连 + TikTok 专用 ISP + 其余美国手选
#
# 设计目标：
# 1. 中国大陆域名/IP默认直连。
# 2. rules/manual-direct.yaml 用于人工追加必须直连的域名。
# 3. TikTok 域名与其 DNS 查询固定进入“TikTok-ISP”，只使用本地模块注入的 IPRoyal-US-ISP。
# 4. 其余所有流量统一进入“美国”策略组。
# 5. “美国”为 select 手动选择组，仅展示订阅中的美国节点，并排除 IPRoyal-US-ISP。
# 6. 非美国节点仍保留在订阅底层，但不进入任何策略组，也不会被规则使用。
# 7. 不按设备/IP/人员拆分规则，因此可供多人、多设备直接复用。
# 8. 不整体覆盖 rule-providers，避免删除 OpenClash 自动生成的 oc-cn-domain 等内部 provider。
# 9. 保留 Fake-IP，同时对局域网和自建回流域名返回真实 IP，降低 NAT 回流/内网访问异常概率。
# 10. 当前网络按 IPv4 方案运行；通过 OpenClash 官方模块参数 IPV6_ENABLE=0 与 IPV6_DNS=0 同时关闭核心 IPv6 和 IPv6 DNS。
# 11. Microsoft Account/Windows 中国可直连系统端点保持 DIRECT；OneDrive Consumer 网页/文件链路强制走美国。
#
# 适用：OpenClash Meta/Mihomo。
# 维护说明见仓库 README.md。

[General]
CORE_TYPE = Meta
PROXY_MODE = rule
RESTART = true
ENABLE_REDIRECT_DNS = 1
ENABLE_CUSTOM_DNS = 1
APPEND_DEFAULT_DNS = 0
APPEND_WAN_DNS = 0
ENABLE_RESPECT_RULES = 1
ROUTER_SELF_PROXY = 1

IPV6_ENABLE = 0
IPV6_DNS = 0

ENABLE_UDP_PROXY = 1
DISABLE_UDP_QUIC = 1
ENABLE_META_SNIFFER = 1
ENABLE_META_SNIFFER_PURE_IP = 1

[YAML]

ipv6: false

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  respect-rules: true
  prefer-h3: false

  default-nameserver:
    - 223.5.5.5
    - 1.12.12.12

  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query

  nameserver:
    - 'https://1.1.1.1/dns-query#美国'
    - 'https://8.8.8.8/dns-query#美国'

  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  direct-nameserver-follow-policy: true

  nameserver-policy:
    'geosite:cn,private':
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
    # TikTok 域名与 DNS 使用同一 IPRoyal 出口，避免业务流量和解析出口分离。
    'geosite:tiktok':
      - 'https://1.1.1.1/dns-query#TikTok-ISP'
      - 'https://8.8.8.8/dns-query#TikTok-ISP'
    'rule-set:TikTok-IPRoyal':
      - 'https://1.1.1.1/dns-query#TikTok-ISP'
      - 'https://8.8.8.8/dns-query#TikTok-ISP'

  fake-ip-filter+:
    - '+.lan'
    - '+.local'
    - '+.home.arpa'
    - 'localhost'
    - 'pve.yangnas.cn'
    - 'auth.yangnas.cn'
    - 'nexus.yangnas.cn'

# ============================================================
# 海外策略组
# ============================================================
proxy-groups!:
  # 本组只收集本地模块中名称完全一致的节点。缺失时 REJECT，不回落机场，避免 TikTok 混用出口。
  - name: TikTok-ISP
    type: select
    include-all-proxies: true
    filter: '^IPRoyal-US-ISP$'
    empty-fallback: REJECT

  - name: 美国
    type: select
    include-all: true
    filter: '(?i)(🇺🇸|美国|美國|United[ _-]?States|USA|America|Los[ _-]?Angeles|San[ _-]?Jose|Seattle|New[ _-]?York|Chicago|Dallas|(?:^|[ _-])US(?:$|[ _-]|[0-9]))'
    # IPRoyal 名称包含 US，必须显式排除，保证它只承载 TikTok。
    exclude-filter: '^IPRoyal-US-ISP$'

# ============================================================
# 手工直连规则提供者
# ============================================================
rule-providers:
  Manual-Direct:
    type: http
    behavior: classical
    format: yaml
    proxy: 美国
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/manual-direct.yaml
    path: ./rule_provider/manual-direct.yaml
    interval: 300

  TikTok-IPRoyal:
    type: http
    behavior: domain
    format: yaml
    proxy: 美国
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/tiktok-iproyal.yaml
    path: ./rule_provider/tiktok-iproyal.yaml
    interval: 300

# ============================================================
# 主分流规则：严格按从上到下顺序匹配，第一条命中即停止。
# ============================================================
rules!:
  # 私有域名 / private GeoIP
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve

  # RFC1918 IPv4 私有地址：必须显式 DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve

  # 其他本地/特殊用途地址
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - IP-CIDR6,ff00::/8,DIRECT,no-resolve

  # TikTok 固定使用本地 IPRoyal ISP；必须早于 Manual-Direct、GEOSITE,cn 和最终 MATCH。
  - RULE-SET,TikTok-IPRoyal,TikTok-ISP
  - GEOSITE,tiktok,TikTok-ISP

  # OneDrive Consumer：网页/文件链路在中国大陆直连可能不可用，强制走美国。
  # 放在 Manual-Direct 与 GEOSITE,cn 之前，避免被其他规则抢先直连。
  - DOMAIN-SUFFIX,onedrive.live.com,美国
  - DOMAIN-SUFFIX,onedrive.com,美国
  - DOMAIN-SUFFIX,files.1drv.com,美国
  - DOMAIN-SUFFIX,livefilestore.com,美国
  - DOMAIN-SUFFIX,storage.live.com,美国
  - DOMAIN-SUFFIX,docs.live.net,美国
  - DOMAIN-SUFFIX,groups.office.live.com,美国
  - DOMAIN-SUFFIX,groups.photos.live.com,美国
  - DOMAIN-SUFFIX,groups.skydrive.live.com,美国
  - DOMAIN-SUFFIX,policies.live.net,美国
  - DOMAIN-SUFFIX,settings.live.net,美国
  - DOMAIN-SUFFIX,storage.msn.com,美国
  - DOMAIN,g.live.com,美国
  - DOMAIN,p.sfx.ms,美国
  - DOMAIN,oneclient.sfx.ms,美国
  - DOMAIN,api.onedrive.com,美国
  - DOMAIN,api.live.net,美国
  - DOMAIN,apis.live.net,美国
  - DOMAIN,skyapi.live.net,美国
  - DOMAIN,snapi.live.net,美国
  - DOMAIN,photos.live.com,美国
  - DOMAIN,skydrive.live.com,美国
  - DOMAIN,favorites.live.com,美国
  - DOMAIN,spoprod-a.akamaihd.net,美国

  # 人工指定必须直连的域名；Microsoft Account 登录/认证也在这里保持 DIRECT。
  - RULE-SET,Manual-Direct,DIRECT

  # 已知海外误分类修正：gstatic.com 属于 Google 静态资源，必须优先走美国。
  - DOMAIN-SUFFIX,gstatic.com,美国

  # 中国大陆域名 / IP
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve

  # 最终兜底：所有其他流量统一走美国
  - MATCH,美国
