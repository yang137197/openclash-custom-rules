# OpenClash 远程覆写：地区节点组 + 设备来源分流 + 手工域名规则
# 适用于 OpenClash v0.47.081+ / Mihomo v1.19.28+。
# 仅追加策略组、规则提供者和规则，不替换第三方订阅模板。

[General]
CORE_TYPE = Meta
PROXY_MODE = rule

# 设备策略按 IPv4 来源地址匹配：DNS 不返回 AAAA，避免同一设备改走 IPv6 后绕过策略。
# 不再用 IP-CIDR6,::/0,REJECT 硬拒绝全部公网 IPv6，避免应用直接判定无网络。
IPV6_DNS = 0

# 开启 UDP 代理，但拒绝 UDP/443 QUIC，使不稳定或不支持 UDP 的节点回落到 TCP/HTTPS。
ENABLE_UDP_PROXY = 1
DISABLE_UDP_QUIC = 1

# 从 TLS/QUIC 纯 IP 连接恢复域名，避免 TikTok CDN 因没有域名而误命中国直连规则。
ENABLE_META_SNIFFER = 1
ENABLE_META_SNIFFER_PURE_IP = 1

[YAML]

profile:
  store-selected: true
  store-fake-ip: true

# 局域网发现名称返回真实地址，避免 Fake-IP 干扰手机连接等本地通信。
dns:
  fake-ip-filter+:
    - '+.lan'
    - '+.local'
    - '+.home.arpa'
    - 'localhost'

# 每个地区提供一个手选组和一个自动测速组。
# 手选组默认选择自动组，也可在面板里固定某个节点；没有匹配节点时安全拒绝。
proxy-groups+:
  - name: 日本
    type: select
    default-selected: 自动-日本
    proxies:
      - 自动-日本
      - REJECT
    include-all: true
    filter: '(?i)(🇯🇵|日本|东京|東京|大阪|Japan|Tokyo|Osaka|(?:^|[ _-])JP(?:$|[ _-]|[0-9]))'

  - name: 自动-日本
    type: url-test
    include-all: true
    filter: '(?i)(🇯🇵|日本|东京|東京|大阪|Japan|Tokyo|Osaka|(?:^|[ _-])JP(?:$|[ _-]|[0-9]))'
    empty-fallback: REJECT
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 100
    lazy: true

  - name: 美国
    type: select
    default-selected: 自动-美国
    proxies:
      - 自动-美国
      - REJECT
    include-all: true
    filter: '(?i)(🇺🇸|美国|美國|United[ _-]?States|USA|America|Los[ _-]?Angeles|San[ _-]?Jose|Seattle|New[ _-]?York|Chicago|Dallas|(?:^|[ _-])US(?:$|[ _-]|[0-9]))'

  - name: 自动-美国
    type: url-test
    include-all: true
    filter: '(?i)(🇺🇸|美国|美國|United[ _-]?States|USA|America|Los[ _-]?Angeles|San[ _-]?Jose|Seattle|New[ _-]?York|Chicago|Dallas|(?:^|[ _-])US(?:$|[ _-]|[0-9]))'
    empty-fallback: REJECT
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 100
    lazy: true

  - name: 新加坡
    type: select
    default-selected: 自动-新加坡
    proxies:
      - 自动-新加坡
      - REJECT
    include-all: true
    filter: '(?i)(🇸🇬|新加坡|狮城|獅城|Singapore|Singapore[ _-]?City|(?:^|[ _-])SG(?:$|[ _-]|[0-9])|(?:^|[ _-])SIN(?:$|[ _-]|[0-9]))'

  - name: 自动-新加坡
    type: url-test
    include-all: true
    filter: '(?i)(🇸🇬|新加坡|狮城|獅城|Singapore|Singapore[ _-]?City|(?:^|[ _-])SG(?:$|[ _-]|[0-9])|(?:^|[ _-])SIN(?:$|[ _-]|[0-9]))'
    empty-fallback: REJECT
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 100
    lazy: true

  # 保留既有业务组名称，实际出口复用日本地区组。
  - name: AI-日本
    type: select
    default-selected: 日本
    proxies:
      - 日本

  # 当前订阅没有俄罗斯节点时保留 DIRECT，避免空策略组导致配置失败。
  - name: 俄罗斯电商
    type: select
    proxies:
      - DIRECT
    include-all: true
    filter: '(?i)(🇷🇺|俄罗斯|俄羅斯|俄国|俄國|Russia|Moscow|Saint[ _-]?Petersburg|莫斯科|圣彼得堡|聖彼得堡|(?:^|[ _-])RU(?:$|[ _-]|[0-9]))'

# 默认合并：保留第三方模板原有的 rule-providers。
rule-providers:
  Linyang-Manual-Direct:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/manual-direct.yaml
    path: ./rule_provider/linyang-manual-direct.yaml
    interval: 86400

  Linyang-Manual-JP:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/manual-jp.yaml
    path: ./rule_provider/linyang-manual-jp.yaml
    interval: 86400

  Linyang-Manual-US:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/manual-us.yaml
    path: ./rule_provider/linyang-manual-us.yaml
    interval: 86400

  Linyang-Manual-SG:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/manual-sg.yaml
    path: ./rule_provider/linyang-manual-sg.yaml
    interval: 86400

  Linyang-Google-Play:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/google-play.yaml
    path: ./rule_provider/linyang-google-play.yaml
    interval: 86400

  Linyang-TikTok:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/tiktok.yaml
    path: ./rule_provider/linyang-tiktok.yaml
    interval: 86400

  Linyang-Device-JP:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/device-jp.yaml
    path: ./rule_provider/linyang-device-jp.yaml
    interval: 86400

  Linyang-Device-US:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/device-us.yaml
    path: ./rule_provider/linyang-device-us.yaml
    interval: 86400

  Linyang-Device-SG:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/device-sg.yaml
    path: ./rule_provider/linyang-device-sg.yaml
    interval: 86400

  Linyang-AI:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/ai.yaml
    path: ./rule_provider/linyang-ai.yaml
    interval: 86400

  Linyang-Russia-Commerce:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/ru-commerce.yaml
    path: ./rule_provider/linyang-ru-commerce.yaml
    interval: 86400

# 前置插入：手工规则和设备地区规则优先于第三方模板。
+rules:
  # 局域网、链路本地和组播始终直连，保证手机连接/投屏/发现不经过代理。
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - IP-CIDR6,ff00::/8,DIRECT,no-resolve

  # 用户手工域名规则：同一域名只放进一个文件，优先级为 DIRECT > 日本 > 美国 > 新加坡。
  - RULE-SET,Linyang-Manual-Direct,DIRECT
  - RULE-SET,Linyang-Manual-JP,日本
  - RULE-SET,Linyang-Manual-US,美国
  - RULE-SET,Linyang-Manual-SG,新加坡

  # TikTok 显式按设备地区代理，补齐 GEOSITE 未覆盖的字节海外共享域名，并优先于国内判断。
  - AND,((RULE-SET,Linyang-Device-JP),(RULE-SET,Linyang-TikTok)),日本
  - AND,((RULE-SET,Linyang-Device-US),(RULE-SET,Linyang-TikTok)),美国
  - AND,((RULE-SET,Linyang-Device-SG),(RULE-SET,Linyang-TikTok)),新加坡

  # Google Play 下载、校验和账号链路必须保持同一设备出口；此处优先于国内域名规则。
  - AND,((RULE-SET,Linyang-Device-JP),(RULE-SET,Linyang-Google-Play)),日本
  - AND,((RULE-SET,Linyang-Device-US),(RULE-SET,Linyang-Google-Play)),美国
  - AND,((RULE-SET,Linyang-Device-SG),(RULE-SET,Linyang-Google-Play)),新加坡

  # 中国大陆域名和 IP 直连。TikTok 和 Google Play 是上面的内置例外。
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve

  # 按来源设备处理剩余流量；可在三个 device-*.yaml 中维护多个局域网地址。
  - RULE-SET,Linyang-Device-JP,日本
  - RULE-SET,Linyang-Device-US,美国
  - RULE-SET,Linyang-Device-SG,新加坡

  # 未指定设备继续使用业务规则和第三方模板。
  - RULE-SET,Linyang-Russia-Commerce,俄罗斯电商
  - RULE-SET,Linyang-AI,AI-日本
