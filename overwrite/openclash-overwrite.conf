# OpenClash 远程覆写：设备地区分流 + AI 日本分流 + 俄罗斯电商分流
# 适用于 OpenClash v0.47.081+ / Mihomo。
# 仅追加策略组、规则提供者和规则，不替换第三方订阅模板的原配置。

[YAML]

profile:
  store-selected: true
  store-fake-ip: true

# 自动排除流量、到期、官网等订阅信息节点。
proxy-groups+:
  - name: 社媒-日本
    type: select
    proxies:
      - REJECT
    include-all: true
    filter: '(?i)(🇯🇵|日本|东京|東京|大阪|Japan|Tokyo|Osaka|(?:^|[ _-])JP(?:$|[ _-]|[0-9]))'
    exclude-filter: '(?i)(剩余|流量|套餐|到期|官网|订阅|重置|Traffic|Expire|群组|以下)'

  - name: 社媒-美国
    type: select
    proxies:
      - REJECT
    include-all: true
    filter: '(?i)(🇺🇸|美国|美國|United[ _-]?States|USA|America|Los[ _-]?Angeles|San[ _-]?Jose|Seattle|New[ _-]?York|Chicago|Dallas|(?:^|[ _-])US(?:$|[ _-]|[0-9]))'
    exclude-filter: '(?i)(剩余|流量|套餐|到期|官网|订阅|重置|Traffic|Expire|群组|以下)'

  - name: AI-日本
    type: url-test
    include-all: true
    filter: '(?i)(🇯🇵|日本|东京|東京|大阪|Japan|Tokyo|Osaka|(?:^|[ _-])JP(?:$|[ _-]|[0-9]))'
    exclude-filter: '(?i)(剩余|流量|套餐|到期|官网|订阅|重置|Traffic|Expire|群组|以下)'
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 100
    lazy: true

  # 当前订阅没有俄罗斯节点时保留 DIRECT，避免空策略组导致配置失败。
  # 后续加入俄罗斯节点后，会按名称自动收集并可在面板中手动选择。
  - name: 俄罗斯电商
    type: select
    proxies:
      - DIRECT
    include-all: true
    filter: '(?i)(🇷🇺|俄罗斯|俄羅斯|俄国|俄國|Russia|Moscow|Saint[ _-]?Petersburg|莫斯科|圣彼得堡|聖彼得堡|(?:^|[ _-])RU(?:$|[ _-]|[0-9]))'
    exclude-filter: '(?i)(剩余|流量|套餐|到期|官网|订阅|重置|Traffic|Expire|群组|以下)'

# 默认合并：保留第三方模板原有的 rule-providers。
rule-providers:
  Linyang-Device-JP:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/device-jp.yaml
    path: ./rule_provider/linyang-device-jp.yaml
    interval: 86400

  Linyang-Device-US:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/device-us.yaml
    path: ./rule_provider/linyang-device-us.yaml
    interval: 86400

  Linyang-AI:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/ai.yaml
    path: ./rule_provider/linyang-ai.yaml
    interval: 86400

  Linyang-Russia-Commerce:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/ru-commerce.yaml
    path: ./rule_provider/linyang-ru-commerce.yaml
    interval: 86400

# 前置插入：保证设备地区规则优先于第三方模板、AI 和俄罗斯电商规则。
+rules:
  # 局域网、ULA 和链路本地地址不进入代理。
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  # Google Play 的中国域名后缀按设备地区代理，避免更新异常。
  - AND,((SRC-IP-CIDR,192.168.100.173/32),(DOMAIN-SUFFIX,googleapis.cn)),社媒-日本
  - AND,((SRC-IP-CIDR,192.168.100.173/32),(DOMAIN-SUFFIX,xn--ngstr-lra8j.com)),社媒-日本
  - AND,((SRC-IP-CIDR,192.168.100.238/32),(DOMAIN-SUFFIX,googleapis.cn)),社媒-美国
  - AND,((SRC-IP-CIDR,192.168.100.238/32),(DOMAIN-SUFFIX,xn--ngstr-lra8j.com)),社媒-美国

  # 中国大陆域名和 IPv4/IPv6 地址直连。
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve

  # 国外 IPv6 不允许直连，客户端回落 IPv4 后再按设备地区分流。
  - IP-CIDR6,::/0,REJECT,no-resolve

  # A 手机（日本）和 B 手机（美国）的所有国外 IPv4 流量。
  - RULE-SET,Linyang-Device-JP,社媒-日本
  - RULE-SET,Linyang-Device-US,社媒-美国

  # 未指定设备继续使用业务规则和第三方模板。
  - RULE-SET,Linyang-Russia-Commerce,俄罗斯电商
  - RULE-SET,Linyang-AI,AI-日本
