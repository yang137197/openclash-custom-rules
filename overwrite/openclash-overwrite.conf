# OpenClash Meta/Mihomo：大陆直连 + TikTok 专用 IPRoyal + 其他流量美国手选

[General]
CORE_TYPE = Meta
EN_MODE = fake-ip
PROXY_MODE = rule
RESTART = true

INTRANET_ALLOWED = 1
BYPASS_GATEWAY_COMPATIBLE = 0
COMMON_PORTS = 0
ROUTER_SELF_PROXY = 1

ENABLE_REDIRECT_DNS = 1
ENABLE_CUSTOM_DNS = 1
APPEND_DEFAULT_DNS = 0
APPEND_WAN_DNS = 0
ENABLE_RESPECT_RULES = 1
STORE_FAKEIP = 1
CUSTOM_FAKEIP_FILTER = 1
CUSTOM_FAKEIP_FILTER_MODE = blacklist

IPV6_ENABLE = 0
IPV6_DNS = 0
CHINA_IP_ROUTE = 0
CHINA_IP6_ROUTE = 0
CHNR_AUTO_UPDATE = 1
CHNR_UPDATE_WEEK_TIME = 1
CHNR_UPDATE_DAY_TIME = 5

ENABLE_UDP_PROXY = 1
DISABLE_UDP_QUIC = 0

ENABLE_META_SNIFFER = 1
ENABLE_META_SNIFFER_PURE_IP = 1
FIND_PROCESS_MODE = off

ENABLE_RULE_PROXY = 0
ENABLE_CUSTOM_CLASH_RULES = 1
SKIP_PROXY_ADDRESS = 0

ENABLE_GEOIP_DAT = 1
GEO_AUTO_UPDATE = 1
GEO_UPDATE_WEEK_TIME = 1
GEO_UPDATE_DAY_TIME = 5
GEOIP_AUTO_UPDATE = 1
GEOIP_UPDATE_WEEK_TIME = 1
GEOIP_UPDATE_DAY_TIME = 5
GEOSITE_AUTO_UPDATE = 1
GEOSITE_UPDATE_WEEK_TIME = 1
GEOSITE_UPDATE_DAY_TIME = 5

[YAML]

ipv6: false

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  respect-rules: true
  prefer-h3: false

  default-nameserver:
    - 223.5.5.5
    - 1.12.12.12

  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query

  nameserver:
    - 'https://1.1.1.1/dns-query#美国'
    - 'https://8.8.8.8/dns-query#美国'

  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  direct-nameserver-follow-policy: true

  nameserver-policy:
    'geosite:cn,private':
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
    'geosite:tiktok':
      - 'https://1.1.1.1/dns-query#TikTok-ISP'
      - 'https://8.8.8.8/dns-query#TikTok-ISP'

  fake-ip-filter+:
    - '+.lan'
    - '+.local'
    - '+.home.arpa'
    - 'localhost'
    - 'pve.yangnas.cn'
    - 'auth.yangnas.cn'
    - 'nexus.yangnas.cn'

proxy-groups!:
  - name: TikTok-ISP
    type: select
    include-all-proxies: true
    filter: '^IPRoyal-US-ISP$'
    empty-fallback: REJECT

  - name: 美国
    type: select
    include-all: true
    filter: '(?i)(🇺🇸|美国|美國|United[ _-]?States|USA|America|Los[ _-]?Angeles|San[ _-]?Jose|Seattle|New[ _-]?York|Chicago|Dallas|(^|[ _-])US($|[ _-]|[0-9]))'
    exclude-filter: '^IPRoyal-US-ISP$'
    empty-fallback: REJECT

# 只追加 Manual-Direct，不整体覆盖 OpenClash 自动生成的 rule-providers。
rule-providers:
  Manual-Direct:
    type: http
    behavior: classical
    format: yaml
    proxy: 美国
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/manual-direct.yaml
    path: ./rule_provider/manual-direct.yaml
    interval: 86400

rules!:
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - IP-CIDR6,ff00::/8,DIRECT,no-resolve

  # TikTok 使用 Mihomo 持续维护的 GeoSite；IPRoyal 缺失时失败关闭。
  - GEOSITE,tiktok,TikTok-ISP

  # 用户长期维护的额外直连域名，必须保留。
  - RULE-SET,Manual-Direct,DIRECT

  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,美国
