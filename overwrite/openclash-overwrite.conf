    proxy: DNS-海外
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/google-play.yaml
    path: ./rule_provider/linyang-v2-google-play.yaml
    interval: 3600

  Linyang-TikTok:
    type: http
    behavior: classical
