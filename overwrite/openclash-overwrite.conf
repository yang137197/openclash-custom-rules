# OpenClash 覆写模块远程订阅
# 适用于 Meta/Mihomo 内核。订阅节点由 Sub-Store 合并，本文件只接管策略组和规则。

[General]
CORE_TYPE = Meta
PROXY_MODE = rule
EN_MODE = fake-ip-mix
STACK_TYPE = system
ENABLE_REDIRECT_DNS = 1
ENABLE_CUSTOM_DNS = 1
APPEND_DEFAULT_DNS = 1
APPEND_WAN_DNS = 0
ENABLE_RESPECT_RULES = 1
STORE_FAKEIP = 1
CUSTOM_FAKEIP_FILTER = 1
CUSTOM_FAKEIP_FILTER_MODE = blacklist
FAKEIP_RANGE = 198.18.0.1/16
IPV6_ENABLE = 0
IPV6_DNS = 0
INTRANET_ALLOWED = 1
ROUTER_SELF_PROXY = 1
CHINA_IP_ROUTE = 1
CHINA_IP6_ROUTE = 0
CHNR_AUTO_UPDATE = 1
ENABLE_META_SNIFFER = 1
ENABLE_META_SNIFFER_CUSTOM = 1
ENABLE_META_SNIFFER_PURE_IP = 1
ENABLE_TCP_CONCURRENT = 1
ENABLE_UNIFIED_DELAY = 1
DISABLE_UDP_QUIC = 0
ENABLE_GEOIP_DAT = 1
GEOIP_AUTO_UPDATE = 1
GEOSITE_AUTO_UPDATE = 1
GEODATA_LOADER = standard
RESTART = true

[YAML]
profile:
  store-selected: true
  store-fake-ip: true

# 使用 ! 强制覆盖订阅自带的同名顶层配置，确保所有策略组由本文件控制。
proxy-groups!:
  - name: AI
    type: select
    include-all: true
    filter: '(?i)(🇯🇵|日本|东京|東京|大阪|Japan|Tokyo|Osaka|(?:^|[ _-])JP(?:$|[ _-]|[0-9]))'
    exclude-filter: '(?i)(剩余|流量|套餐|到期|官网|订阅|重置|Traffic|Expire|群组|以下)'
    exclude-type: direct

  - name: 俄罗斯
    type: select
    include-all: true
    filter: '(?i)(🇷🇺|俄罗斯|俄羅斯|俄国|俄國|Russia|Moscow|Saint[ _-]?Petersburg|莫斯科|圣彼得堡|聖彼得堡|(?:^|[ _-])RU(?:$|[ _-]|[0-9]))'
    exclude-filter: '(?i)(剩余|流量|套餐|到期|官网|订阅|重置|Traffic|Expire|群组|以下)'
    exclude-type: direct

  - name: 美国
    type: select
    include-all: true
    filter: '(?i)(🇺🇸|美国|美國|United[ _-]?States|America|Los[ _-]?Angeles|Phoenix|San[ _-]?Jose|Seattle|New[ _-]?York|Dallas|Chicago|洛杉矶|洛杉磯|凤凰城|鳳凰城|圣何塞|聖何塞|西雅图|西雅圖|纽约|紐約|达拉斯|達拉斯|芝加哥|USA(?:$|[ _-]|[0-9])|(?:^|[ _-])US(?:$|[ _-]|[0-9]))'
    exclude-filter: '(?i)(剩余|流量|套餐|到期|官网|订阅|重置|Traffic|Expire|群组|以下)'
    exclude-type: direct

  - name: 默认代理
    type: select
    proxies:
      - AI
      - 美国
      - 俄罗斯
      - DIRECT
    include-all: true
    exclude-filter: '(?i)(剩余|流量|套餐|到期|官网|订阅|重置|Traffic|Expire|群组|以下)'
    exclude-type: direct

rule-providers!:
  AI-Services:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/ai.yaml
    path: ./rule_provider/ai-services.yaml
    interval: 86400
    proxy: 默认代理

  Russia-Commerce:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/ru-commerce.yaml
    path: ./rule_provider/ru-commerce.yaml
    interval: 86400
    proxy: 默认代理

rules!:
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - RULE-SET,Russia-Commerce,俄罗斯
  - RULE-SET,AI-Services,AI
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,默认代理
