    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/docker.yaml
    path: ./rule_provider/linyang-v2-docker.yaml
    interval: 3600

  Linyang-Device-JP:
    type: http
    behavior: classical
    format: yaml
    proxy: DNS-海外
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/device-jp.yaml
    path: ./rule_provider/linyang-v2-device-jp.yaml
