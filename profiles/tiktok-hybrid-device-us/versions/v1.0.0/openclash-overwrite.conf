# OpenClash Meta/Mihomo：指定设备 TikTok 走美国 + 其他设备 TikTok 防泄漏 + 大陆直连

# OpenClash 插件选项全部按本方案 README 在中文界面手动设置。
# 本模块有意不使用 [General]，只维护最终的 Mihomo YAML 配置。

[YAML]

ipv6: false

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  respect-rules: true
  prefer-h3: false

  default-nameserver:
    - 223.5.5.5
    - 1.12.12.12

  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query

  nameserver:
    - 'https://1.1.1.1/dns-query#美国'
    - 'https://8.8.8.8/dns-query#美国'

  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  direct-nameserver-follow-policy: true

  nameserver-policy:
    # Google Play 的 .cn API 和下载域名不得使用中国规则的 DNS；经美国出口解析。
    # 两个匹配器必须保持为独立键；不能合并成 geosite:google,+.域名。
    '+.xn--ngstr-lra8j.com':
      - 'https://1.1.1.1/dns-query#美国'
      - 'https://8.8.8.8/dns-query#美国'
    'geosite:google':
      - 'https://1.1.1.1/dns-query#美国'
      - 'https://8.8.8.8/dns-query#美国'
    # 允许指定设备经美国策略访问 TikTok，因此 TikTok 不能再全局返回空 DNS。
    # 未授权设备即使获得解析结果，其可识别的 TikTok 连接仍由下方规则拒绝。
    'geosite:tiktok':
      - 'https://1.1.1.1/dns-query#美国'
      - 'https://8.8.8.8/dns-query#美国'
    'geosite:cn,private':
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query

  fake-ip-filter+:
    - '+.lan'
    - '+.local'
    - '+.home.arpa'
    - 'localhost'
    - 'pve.yangnas.cn'
    - 'auth.yangnas.cn'
    - 'nexus.yangnas.cn'

proxy-groups!:
  - name: 美国
    type: select
    include-all: true
    filter: '(?i)(🇺🇸|美国|美國|(^|[ _-])United[ _-]?States($|[ _-]|[0-9])|(^|[ _-])USA($|[ _-]|[0-9])|(^|[ _-])US($|[ _-]|[0-9]))'
    # IPRoyal 只能由手机 SocksTun 使用，不允许进入机场美国组。
    exclude-filter: '(?i)^IPRoyal-'
    empty-fallback: REJECT

# 只追加 Manual-Direct，不整体覆盖 OpenClash 自动生成的 rule-providers。
rule-providers:
  Manual-Direct:
    type: http
    behavior: classical
    format: yaml
    proxy: 美国
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/manual-direct.yaml
    path: ./rule_provider/manual-direct.yaml
    interval: 86400

rules!:
  # H6：局域网和私有地址始终直连。
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - IP-CIDR6,ff00::/8,DIRECT,no-resolve

  # H1：只有这个固定来源 IP 的 TikTok 可使用现有“美国”策略组。
  - AND,((SRC-IP-CIDR,192.168.100.248/32),(GEOSITE,tiktok)),美国

  # H2：其他设备泄漏到 OpenClash 的可识别 TikTok 连接继续失败关闭。
  - GEOSITE,tiktok,REJECT

  # H7：Google 是国外流量；必须位于 Manual-Direct 和中国规则之前。
  # xn--ngstr-lra8j.com 是 Google Play 下载域名，避免被 GeoSite/cn 误判为直连。
  - DOMAIN-SUFFIX,xn--ngstr-lra8j.com,美国
  - GEOSITE,google,美国

  # H5：用户长期维护的额外直连域名，必须保留。
  - RULE-SET,Manual-Direct,DIRECT

  # H4：中国大陆域名和 IP 直连。
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve

  # H3：未命中以上规则的其他国外流量走手选机场美国节点。
  - MATCH,美国
