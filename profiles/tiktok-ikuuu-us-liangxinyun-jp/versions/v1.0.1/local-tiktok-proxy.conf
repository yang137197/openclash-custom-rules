# 路由器本地模板。填写后仅保存在路由器本地。
[YAML]
proxies!:
  # 用 iKuuu 的完整节点条目替换这两项，保留行内指定的名称。
  - name: iKuuu-US-Z01
    type: 'FILL_ME_IKUUU_Z01_NODE_TYPE'
  - name: iKuuu-US-Z02
    type: 'FILL_ME_IKUUU_Z02_NODE_TYPE'
  - name: TikTok-ISP-Local
    type: socks5
    server: 'FILL_ME_PROXY_HOST'
    port: FILL_ME_PROXY_PORT
    username: 'FILL_ME_USERNAME'
    password: 'FILL_ME_PASSWORD'
    udp: false
    dialer-proxy: TikTok-首跳

proxy-providers!:
  Liangxinyun-JP:
    type: http
    url: 'https://subscription.example.invalid/FILL_ME_LIANGXINYUN_URL'
    path: ./proxy_provider/liangxinyun-jp-fast.yaml
    interval: 3600
    proxy: DIRECT
    filter: '^FILL_ME_VERIFIED_JAPAN_NODE_NAME$'
