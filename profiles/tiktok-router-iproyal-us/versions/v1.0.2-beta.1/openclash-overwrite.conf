# tiktok-router-iproyal-us v1.0.2-beta.1 candidate — OpenClash 用户指南基线
# 必须同时按 SETUP.md 手工启用大陆 IPv4 绕过；本模块不写插件选项。
# 所有手机经 OpenClash 本地 IPRoyal-US-ISP 访问 TikTok；凭据不在本模块中。
[YAML]

ipv6: false

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  respect-rules: true
  prefer-h3: false
  # 保留插件生成的 listen/enhanced-mode/fake-ip-range；显式管理解析器和策略。
  default-nameserver:
    - 223.5.5.5
    - 1.12.12.12
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  proxy-server-nameserver-policy!: {}
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  direct-nameserver-follow-policy: false
  fallback!: []
  fallback-filter-:
  nameserver-policy!:
    'geosite:tiktok':
      - 'https://1.1.1.1/dns-query#TikTok-ISP'
      - 'https://8.8.8.8/dns-query#TikTok-ISP'
    '+.xn--ngstr-lra8j.com':
      - 'https://1.1.1.1/dns-query#美国'
      - 'https://8.8.8.8/dns-query#美国'
    'geosite:google':
      - 'https://1.1.1.1/dns-query#美国'
      - 'https://8.8.8.8/dns-query#美国'

  # 使用有顺序的规则模式，而非把 cn 和 Google 同时塞进黑名单。
  # Google/TikTok 必须先返回 Fake-IP，使可识别连接进入核心而不提前大陆旁路。
  fake-ip-filter-mode: rule
  fake-ip-filter!:
    - GEOSITE,tiktok,fake-ip
    - DOMAIN-SUFFIX,xn--ngstr-lra8j.com,fake-ip
    - GEOSITE,google,fake-ip
    - DOMAIN,localhost,real-ip
    - DOMAIN-SUFFIX,lan,real-ip
    - DOMAIN-SUFFIX,local,real-ip
    - DOMAIN-SUFFIX,home.arpa,real-ip
    - GEOSITE,private,real-ip
    - RULE-SET,Manual-Direct,real-ip
    - RULE-SET,oc-cn-domain,real-ip
    - MATCH,fake-ip

proxy-groups!:
  - name: TikTok-ISP
    type: select
    include-all-proxies: true
    filter: '^IPRoyal-US-ISP$'
    empty-fallback: REJECT
  - name: 美国
    type: select
    include-all: true
    filter: '(?i)(🇺🇸|美国|美國|(^|[ _-])United[ _-]?States($|[ _-]|[0-9])|(^|[ _-])USA($|[ _-]|[0-9])|(^|[ _-])US($|[ _-]|[0-9]))'
    exclude-filter: '(?i)^IPRoyal-'
    empty-fallback: REJECT

# Hash 合并，保留插件其他 provider；显式声明所引用的 CN MRS，避免悬空引用。
rule-providers:
  oc-cn-domain:
    type: http
    behavior: domain
    format: mrs
    proxy: 美国
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs
    path: ./rule_provider/guide-cn.mrs
    interval: 86400
  Manual-Direct:
    type: http
    behavior: classical
    format: yaml
    proxy: 美国
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/manual-direct.yaml
    path: ./rule_provider/manual-direct.yaml
    interval: 86400

rules!:
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - IP-CIDR6,ff00::/8,DIRECT,no-resolve
  - GEOSITE,tiktok,TikTok-ISP
  # 核心可能跳过不支持 UDP 的代理；同分类拒绝规则阻止落入美国或直连。
  - GEOSITE,tiktok,REJECT
  - DOMAIN-SUFFIX,xn--ngstr-lra8j.com,美国
  - GEOSITE,google,美国
  - RULE-SET,Manual-Direct,DIRECT
  - RULE-SET,oc-cn-domain,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,美国
