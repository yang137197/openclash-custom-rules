# v1.8.2 candidate companion: above the EXISTING full cloud module, initially disabled.
# Must pass scope_guard.py against the complete current baseline before any application.
# Does not select tiers without the Lua controller. No rules, DNS or TikTok edits.
[YAML]
proxy-groups*:
  where:
    name: 良心云
  set:
    type: select
    proxies!: [REJECT]
    use!: [liangxinyun]
    include-all-:
    include-all-proxies-:
    include-all-providers-:
    exclude-filter-:
    default-selected: REJECT
    filter: '日本专线|日本高速|美国.*流媒体|流媒体.*美国|美国高速'
    empty-fallback: REJECT
proxy-providers*:
  where:
    key: liangxinyun
  set:
    filter: '日本专线|日本高速|美国.*流媒体|流媒体.*美国|美国高速'
    health-check!:
      enable: true
      url: https://www.gstatic.com/generate_204
      expected-status: 204
      interval: 60
      timeout: 5000
      lazy: false
