[YAML]
{
  "proxy-groups*": {
    "where": {
      "name": "良心云"
    },
    "set": {
      "type": "url-test",
      "url": "https://www.gstatic.com/generate_204",
      "interval": 60,
      "timeout": 5000,
      "lazy": false,
      "expected-status": 204,
      "tolerance": 0,
      "empty-fallback": "REJECT",
      "hidden": false,
      "proxies!": [
        "良心云-严格控制"
      ],
      "use-": null,
      "include-all-": null,
      "include-all-proxies-": null,
      "include-all-providers-": null,
      "exclude-filter-": null,
      "default-selected-": null,
      "filter-": null
    }
  },
  "proxy-groups+": [
    {
      "name": "良心云-严格控制",
      "type": "select",
      "proxies": [
        "REJECT"
      ],
      "use": [
        "liangxinyun"
      ],
      "default-selected": "REJECT",
      "filter": "日本专线|日本高速|美国.*流媒体|流媒体.*美国|美国高速",
      "empty-fallback": "REJECT",
      "hidden": false,
      "url": "https://www.gstatic.com/generate_204",
      "interval": 60,
      "timeout": 5000,
      "lazy": false,
      "expected-status": 204
    }
  ],
  "proxy-providers*": {
    "where": {
      "key": "liangxinyun"
    },
    "set": {
      "filter": "日本专线|日本高速|美国.*流媒体|流媒体.*美国|美国高速",
      "health-check!": {
        "enable": true,
        "url": "https://www.gstatic.com/generate_204",
        "expected-status": 204,
        "interval": 60,
        "timeout": 5000,
        "lazy": false
      }
    }
  },
  "<proxy-groups>*": {
    "where": {
      "name": "/^(TikTok首跳|TikTok测速)$/"
    },
    "set": {
      "url": "https://www.gstatic.com/generate_204",
      "interval": 60,
      "timeout": 5000,
      "lazy": false,
      "expected-status": 204
    }
  },
  "proxy-groups-": [
    {
      "name": "良心云-严格控制",
      "type": "select",
      "proxies": [
        "REJECT"
      ],
      "use": [
        "liangxinyun"
      ],
      "default-selected": "REJECT",
      "filter": "日本专线|日本高速|美国.*流媒体|流媒体.*美国|美国高速",
      "empty-fallback": "REJECT",
      "hidden": true
    }
  ]
}
