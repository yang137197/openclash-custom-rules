[YAML]
{
  "proxy-groups!": [
    {
      "name": "TIKTOK首跳",
      "type": "select",
      "url": "https://www.gstatic.com/generate_204",
      "interval": 60,
      "timeout": 5000,
      "lazy": false,
      "expected-status": 204,
      "proxies": [
        "REJECT"
      ],
      "default-selected": "REJECT",
      "include-all": true,
      "filter": "^(REJECT|(?:🇯🇵 )?日本Z0[1-4] \\| IEPL[ \\t]*)$",
      "empty-fallback": "REJECT"
    },
    {
      "name": "TIKTOK访问检测",
      "type": "select",
      "url": "https://www.gstatic.com/generate_204",
      "interval": 60,
      "timeout": 5000,
      "lazy": false,
      "expected-status": 204,
      "include-all-proxies": true,
      "filter": "^TikTok-ISP-Local$",
      "empty-fallback": "REJECT"
    },
    {
      "name": "良心云-按档位自动切换",
      "type": "select",
      "proxies": [
        "REJECT"
      ],
      "use": [
        "liangxinyun"
      ],
      "default-selected": "REJECT",
      "filter": "日本专线|日本高速|美国.*流媒体|流媒体.*美国|美国高速",
      "empty-fallback": "REJECT",
      "hidden": false,
      "url": "https://www.gstatic.com/generate_204",
      "interval": 60,
      "timeout": 5000,
      "lazy": false,
      "expected-status": 204
    }
  ],
  "proxies*": {
    "where": {
      "name": "TikTok-ISP-Local"
    },
    "set": {
      "dialer-proxy": "TIKTOK首跳"
    }
  },
  "proxy-providers*": {
    "where": {
      "key": "liangxinyun"
    },
    "set": {
      "filter": "日本专线|日本高速|美国.*流媒体|流媒体.*美国|美国高速",
      "health-check!": {
        "enable": true,
        "url": "https://www.gstatic.com/generate_204",
        "interval": 60,
        "timeout": 5000,
        "lazy": false,
        "expected-status": 204
      }
    }
  },
  "dns": {
    "nameserver-policy!": {
      "geosite:tiktok": [
        "https://1.1.1.1/dns-query#TIKTOK访问检测",
        "https://8.8.8.8/dns-query#TIKTOK访问检测"
      ],
      "+.xn--ngstr-lra8j.com": [
        "https://1.1.1.1/dns-query#良心云-按档位自动切换",
        "https://8.8.8.8/dns-query#良心云-按档位自动切换"
      ],
      "geosite:google": [
        "https://1.1.1.1/dns-query#良心云-按档位自动切换",
        "https://8.8.8.8/dns-query#良心云-按档位自动切换"
      ]
    }
  },
  "rule-providers*": {
    "where": {
      "proxy": "良心云"
    },
    "set": {
      "proxy": "良心云-按档位自动切换"
    }
  },
  "rules!": [
    "GEOSITE,private,DIRECT",
    "GEOIP,private,DIRECT,no-resolve",
    "IP-CIDR,10.0.0.0/8,DIRECT,no-resolve",
    "IP-CIDR,172.16.0.0/12,DIRECT,no-resolve",
    "IP-CIDR,192.168.0.0/16,DIRECT,no-resolve",
    "IP-CIDR,127.0.0.0/8,DIRECT,no-resolve",
    "IP-CIDR,169.254.0.0/16,DIRECT,no-resolve",
    "IP-CIDR,224.0.0.0/4,DIRECT,no-resolve",
    "IP-CIDR6,::1/128,DIRECT,no-resolve",
    "IP-CIDR6,fc00::/7,DIRECT,no-resolve",
    "IP-CIDR6,fe80::/10,DIRECT,no-resolve",
    "IP-CIDR6,ff00::/8,DIRECT,no-resolve",
    "DOMAIN-SUFFIX,github.com,良心云-按档位自动切换",
    "DOMAIN-SUFFIX,githubusercontent.com,良心云-按档位自动切换",
    "DOMAIN-SUFFIX,githubassets.com,良心云-按档位自动切换",
    "GEOSITE,tiktok,TIKTOK访问检测",
    "GEOSITE,tiktok,REJECT",
    "DOMAIN-SUFFIX,xn--ngstr-lra8j.com,良心云-按档位自动切换",
    "GEOSITE,google,良心云-按档位自动切换",
    "RULE-SET,Manual-Direct,DIRECT",
    "RULE-SET,oc-cn-domain,DIRECT",
    "GEOIP,CN,DIRECT,no-resolve",
    "MATCH,良心云-按档位自动切换",
    "MATCH,REJECT"
  ]
}
