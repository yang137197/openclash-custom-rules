# Router-local placeholders only. Never publish a filled copy.
[YAML]
dns: {}
proxy-providers:
  dual-ikuuu:
    type: http
    url: FILL_ME_IKUUU_SUBSCRIPTION_URL
    path: ./proxy_provider/dual-ikuuu.yaml
    interval: 3600
    proxy: DIRECT
    filter: (?i)日本\s*Z\s*[0-9]+\s*\|\s*IEPL(?:\s|\||$)
    override:
      additional-prefix: 'IK: '
    health-check: &id001
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 60
      timeout: 5000
      lazy: false
      expected-status: '204'
  dual-liangxinyun:
    type: http
    url: FILL_ME_LIANGXINYUN_SUBSCRIPTION_URL
    path: ./proxy_provider/dual-liangxinyun.yaml
    interval: 3600
    proxy: DIRECT
    filter: (?i)日本\s*(?:专线\s*(?:0[1-9]|[1-9][0-9])\s*\|\s*BGP\s*\|\s*流媒体|高速\s*(?:0[1-9]|[1-9][0-9])\s*\|\s*BGP\s*\|\s*CUCM)(?:\s|\||$)
    override:
      additional-prefix: 'LXY: '
    health-check: *id001
proxies+:
- name: TikTok-ISP-Local
  type: socks5
  server: FILL_ME_PROXY_HOST
  port: FILL_ME_PROXY_PORT
  username: FILL_ME_USERNAME
  password: FILL_ME_PASSWORD
  udp: false
  dialer-proxy: TikTok首跳
