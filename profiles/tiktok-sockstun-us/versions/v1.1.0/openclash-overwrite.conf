# OpenClash Meta/Mihomo：大陆直连 + TikTok 泄漏阻断 + Google/其他国外流量美国手选 + 指定网站日本手选

# OpenClash 插件选项全部按 README 在中文界面手动设置。
# 本模块有意不使用 [General]，只维护最终的 Mihomo YAML 配置。

[YAML]

ipv6: false

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  respect-rules: true
  prefer-h3: false

  default-nameserver:
    - 223.5.5.5
    - 1.12.12.12

  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query

  nameserver:
    - 'https://1.1.1.1/dns-query#美国'
    - 'https://8.8.8.8/dns-query#美国'

  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  direct-nameserver-follow-policy: true

  nameserver-policy:
    # Google Play 的 .cn API 和下载域名不得使用中国规则的 DNS；经美国出口解析。
    # 两个匹配器必须保持为独立键；不能合并成 geosite:google,+.域名。
    '+.xn--ngstr-lra8j.com':
      - 'https://1.1.1.1/dns-query#美国'
      - 'https://8.8.8.8/dns-query#美国'
    'geosite:google':
      - 'https://1.1.1.1/dns-query#美国'
      - 'https://8.8.8.8/dns-query#美国'
    'geosite:cn,private':
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
    # TikTok 应只在手机 SocksTun 内解析；泄漏到 OpenClash 的查询返回空结果。
    'geosite:tiktok': rcode://success

  fake-ip-filter+:
    - '+.lan'
    - '+.local'
    - '+.home.arpa'
    - 'localhost'
    - 'pve.yangnas.cn'
    - 'auth.yangnas.cn'
    - 'nexus.yangnas.cn'

proxy-groups!:
  - name: 美国
    type: select
    include-all: true
    filter: '(?i)(🇺🇸|美国|美國|(^|[ _-])United[ _-]?States($|[ _-]|[0-9])|(^|[ _-])USA($|[ _-]|[0-9])|(^|[ _-])US($|[ _-]|[0-9]))'
    # 迁移期间即使旧 IPRoyal 本地节点尚未删除，也不允许进入机场美国组。
    exclude-filter: '(?i)^IPRoyal-'
    empty-fallback: REJECT
  - name: 日本
    type: select
    include-all: true
    filter: '(?i)(🇯🇵|日本|东京|東京|大阪|名古屋|埼玉|(^|[ _-])Japan($|[ _-]|[0-9])|(^|[ _-])JP($|[ _-]|[0-9])|(^|[ _-])Tokyo($|[ _-]|[0-9])|(^|[ _-])Osaka($|[ _-]|[0-9]))'
    # IPRoyal 只能由手机 SocksTun 使用，不得进入 OpenClash 的任何机场策略组。
    exclude-filter: '(?i)^IPRoyal-'
    empty-fallback: REJECT

# 只追加人工规则集，不整体覆盖 OpenClash 自动生成的 rule-providers。
rule-providers:
  Manual-Direct:
    type: http
    behavior: classical
    format: yaml
    proxy: 美国
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/manual-direct.yaml
    path: ./rule_provider/manual-direct.yaml
    interval: 86400
  Manual-Japan:
    type: http
    behavior: classical
    format: yaml
    proxy: 美国
    url: https://raw.githubusercontent.com/yang137197/openclash-custom-rules/main/rules/manual-japan.yaml
    path: ./rule_provider/manual-japan.yaml
    interval: 86400

rules!:
  # R5：局域网和私有地址始终直连。
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - IP-CIDR6,ff00::/8,DIRECT,no-resolve

  # R1：TikTok 必须由手机 SocksTun 承载；任何泄漏到 OpenClash 的 TikTok 流量都拒绝。
  - GEOSITE,tiktok,REJECT

  # R6：Google 是国外流量；这是已验证稳定顺序，必须位于人工规则和中国规则之前。
  # xn--ngstr-lra8j.com 是 Google Play 下载域名，避免被 GeoSite/cn 误判为直连。
  - DOMAIN-SUFFIX,xn--ngstr-lra8j.com,美国
  - GEOSITE,google,美国

  # R10：用户指定的特殊网站优先走手选日本节点。
  - RULE-SET,Manual-Japan,日本

  # R4：用户长期维护的额外直连域名，必须保留。
  - RULE-SET,Manual-Direct,DIRECT

  # R3：中国大陆域名和 IP 直连。
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve

  # R2：除 TikTok 和日本人工规则外，未命中以上规则的国外流量走手选机场美国节点。
  - MATCH,美国
